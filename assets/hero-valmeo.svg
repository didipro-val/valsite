<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">Bijoux artisanaux Valmeo</title>
  <desc id="desc">Mise en scene elegante de boucles dorees, perles nacrees et tissu clair.</desc>
  <defs>
    <linearGradient id="linen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f1e7"/>
      <stop offset=".52" stop-color="#e7d5c5"/>
      <stop offset="1" stop-color="#c9aa98"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="20%" r="70%">
      <stop offset="0" stop-color="#fffaf2" stop-opacity=".95"/>
      <stop offset=".7" stop-color="#fffaf2" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fffaf2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#9d6c35"/>
      <stop offset=".28" stop-color="#e7c47b"/>
      <stop offset=".55" stop-color="#fff0bd"/>
      <stop offset=".82" stop-color="#bd8540"/>
      <stop offset="1" stop-color="#70491f"/>
    </linearGradient>
    <radialGradient id="pearl" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset=".42" stop-color="#f7eee4"/>
      <stop offset="1" stop-color="#cdb9a8"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#4a3328" flood-opacity=".24"/>
    </filter>
    <filter id="grain">
      <feTurbulence baseFrequency=".75" numOctaves="2" seed="7" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .06"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1400" height="1100" fill="url(#linen)"/>
  <rect width="1400" height="1100" fill="url(#glow)"/>
  <rect width="1400" height="1100" filter="url(#grain)" opacity=".55"/>
  <path d="M0 810C210 735 340 900 560 845c238-60 324-288 610-230 111 23 178 82 230 145v340H0Z" fill="#efe2d7" opacity=".68"/>
  <g filter="url(#softShadow)">
    <ellipse cx="935" cy="520" rx="265" ry="360" fill="#f8efe5" opacity=".94"/>
    <ellipse cx="935" cy="520" rx="214" ry="306" fill="#d7b6a5" opacity=".32"/>
    <g transform="translate(760 270)">
      <path d="M118 54c-26 58-38 108-38 150 0 122 74 210 174 210s174-88 174-210c0-42-12-92-38-150" fill="none" stroke="url(#gold)" stroke-width="34" stroke-linecap="round"/>
      <circle cx="118" cy="54" r="48" fill="url(#pearl)"/>
      <circle cx="390" cy="54" r="48" fill="url(#pearl)"/>
      <path d="M171 116c44 42 121 43 167 0" fill="none" stroke="#8f6c4e" stroke-width="9" stroke-linecap="round" opacity=".45"/>
      <circle cx="254" cy="438" r="72" fill="url(#pearl)"/>
      <path d="M207 512c33 24 63 36 92 36 31 0 62-12 96-36" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>
  <g filter="url(#softShadow)" transform="translate(230 250)">
    <rect x="0" y="180" width="440" height="330" rx="38" fill="#fff9f0" opacity=".9"/>
    <path d="M75 235c78 42 209 46 292 0" fill="none" stroke="#c5975a" stroke-width="15" stroke-linecap="round"/>
    <circle cx="140" cy="312" r="42" fill="url(#pearl)"/>
    <circle cx="220" cy="330" r="33" fill="#d5a37f"/>
    <circle cx="297" cy="312" r="42" fill="url(#pearl)"/>
    <path d="M145 395c54 45 101 45 151 0" fill="none" stroke="#70491f" stroke-width="12" stroke-linecap="round"/>
  </g>
